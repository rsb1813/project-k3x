[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-k3x"
version = "0.1.0.dev0"
description = "A Kimi K3-specific out-of-core inference engine"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "google-crc32c==1.8.0",
  "numpy==2.5.1",
  "psutil==7.2.2",
  "safetensors==0.8.0",
  "torch==2.13.0",
]

[project.scripts]
k3x-convert = "k3x_converter.cli:main"

[project.optional-dependencies]
dev = [
  "cmake==4.4.2",
  "ninja==1.13.0",
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["reference", "converter"]

[tool.pytest.ini_options]
pythonpath = ["reference", "converter"]
testpaths = ["tests/python"]
addopts = "--strict-config --strict-markers"
